services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: unword
      POSTGRES_PASSWORD: unword
      POSTGRES_DB: unword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://unword:unword@postgres:5432/unword?sslmode=disable
    depends_on:
      - postgres

volumes:
  postgres_data: